<script>
(function () {
  window.__themeIsDark = function () {
    var mode = 'auto';
    try { mode = localStorage.getItem('theme-mode') || 'auto'; } catch (e) {}
    // 预览用：?theme=light / ?theme=dark 临时覆盖，不写入本地
    try {
      var q = new URLSearchParams(location.search).get('theme');
      if (q === 'light' || q === 'dark') mode = q;
    } catch (e) {}
    if (mode === 'dark') return true;
    if (mode === 'light') return false;
    var hour = Number(new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Shanghai',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
    return hour < 7 || hour >= 19;
  };
  window.__themeApply = function () {
    var dark = window.__themeIsDark();
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.style.colorScheme = dark ? 'dark' : 'light';
    var link = document.getElementById('css-dark');
    if (link) link.media = dark ? 'all' : 'not all';
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      var mode = 'auto';
      try { mode = localStorage.getItem('theme-mode') || 'auto'; } catch (e) {}
      btn.setAttribute('data-mode', mode);
      btn.setAttribute('title', mode === 'auto' ? '自动（北京时间 07:00–19:00 浅色）' : (mode === 'dark' ? '强制深色' : '强制浅色'));
    }
  };
  window.__themeApply();
})();
</script>
